name: Research backtest (exits + trend)

# Research only: replays recorded trades, posts nothing, touches no live state.
# Runs here because the candle APIs are reachable from GitHub runners.
on:
  push:
    branches: [claude/project-thread-p6ucj0]
    paths: [research/**, .github/workflows/research_backtest.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    concurrency: research-${{ github.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore recorded trades (read-only)
        run: bash .github/scripts/restore_runtime_state.sh daily_backtest_finalized_records.jsonl
      - name: Replay trades
        run: python research/exit_trend_backtest.py --records daily_backtest_finalized_records.jsonl --out research/out 2>&1 | tee research/out.log
      - run: pip install tabulate && python research/edge_report.py --records daily_backtest_finalized_records.jsonl
      - name: Commit results to this branch
        run: |
          mkdir -p research/out && mv research/out.log research/out/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add research/out
          git commit -m "Research backtest results [skip ci]" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
