name: Backtest audit (research)

# Research only: re-grades recorded trades on fresh candles, posts nothing,
# touches no live state. Runs here because the candle APIs are reachable from
# GitHub runners and not from the cloud sessions that wrote it.
on:
  push:
    branches: [claude/project-thread-ts1bzx]
    paths: [research/backtest_audit.py, .github/workflows/backtest_audit.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    concurrency: audit-${{ github.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore recorded trades (read-only)
        run: >
          bash .github/scripts/restore_runtime_state.sh
          daily_backtest_finalized_records.jsonl
          crypto_alert_records.jsonl crypto_alert_records_30m.jsonl
          nse_alert_records.jsonl nse_alert_records_30m.jsonl
      - name: Audit
        run: python research/backtest_audit.py 2>&1 | tee research/audit.log
      - name: Commit results to this branch
        if: always()
        run: |
          mkdir -p research/out/audit && mv research/audit.log research/out/audit/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add research/out/audit
          git commit -m "Backtest audit results [skip ci]" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
