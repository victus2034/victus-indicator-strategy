name: Victus Fib + Trendline Alerts

on:
  # Rides on the 30m scanner, which cron-job.org dispatches every ~5 minutes:
  # each time it finishes, this runs once. No second cron-job.org job to set
  # up, and GitHub's own scheduler is not used - it honours only a fraction
  # of scheduled runs (see scan_30m.yml).
  workflow_run:
    workflows: ["Victus Crypto Scanner 30m"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: victus-fib-trendline
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: bash .github/scripts/restore_runtime_state.sh fib_trendline_state.json fib_trendline_alert_records.jsonl fib_trendline_results.json

      - name: Check fib/trendline Discord webhook configuration
        env:
          DISCORD_FIB_WEBHOOK_URL: ${{ secrets.DISCORD_FIB_WEBHOOK_URL }}
          DISCORD_TRENDLINE_WEBHOOK_URL: ${{ secrets.DISCORD_TRENDLINE_WEBHOOK_URL }}
          DISCORD_FIB_CRYPTO_WEBHOOK_URL: ${{ secrets.DISCORD_FIB_CRYPTO_WEBHOOK_URL }}
          DISCORD_FIB_NSE_WEBHOOK_URL: ${{ secrets.DISCORD_FIB_NSE_WEBHOOK_URL }}
          DISCORD_TRENDLINE_CRYPTO_WEBHOOK_URL: ${{ secrets.DISCORD_TRENDLINE_CRYPTO_WEBHOOK_URL }}
          DISCORD_TRENDLINE_NSE_WEBHOOK_URL: ${{ secrets.DISCORD_TRENDLINE_NSE_WEBHOOK_URL }}
        run: |
          for name in DISCORD_FIB_CRYPTO_WEBHOOK_URL DISCORD_FIB_NSE_WEBHOOK_URL DISCORD_TRENDLINE_CRYPTO_WEBHOOK_URL DISCORD_TRENDLINE_NSE_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not configured - that market falls back to the shared webhook, or is held."
            else
              echo "$name is configured."
            fi
          done

      - name: Run fib/trendline scanner once
        env:
          DISCORD_FIB_WEBHOOK_URL: ${{ secrets.DISCORD_FIB_WEBHOOK_URL }}
          DISCORD_TRENDLINE_WEBHOOK_URL: ${{ secrets.DISCORD_TRENDLINE_WEBHOOK_URL }}
          DISCORD_FIB_CRYPTO_WEBHOOK_URL: ${{ secrets.DISCORD_FIB_CRYPTO_WEBHOOK_URL }}
          DISCORD_FIB_NSE_WEBHOOK_URL: ${{ secrets.DISCORD_FIB_NSE_WEBHOOK_URL }}
          DISCORD_TRENDLINE_CRYPTO_WEBHOOK_URL: ${{ secrets.DISCORD_TRENDLINE_CRYPTO_WEBHOOK_URL }}
          DISCORD_TRENDLINE_NSE_WEBHOOK_URL: ${{ secrets.DISCORD_TRENDLINE_NSE_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          # The once-a-day score of the live fib/trendline alerts goes to the
          # existing daily-backtest channel (fib_trendline_daily_report.py).
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
        # Crypto every pass; NSE (200 stocks, Yahoo) only in the session and at
        # most every 8 minutes - that pass takes ~3 minutes on its own.
        run: python fib_trendline_scanner.py

      # always(): alerts already posted are recorded even if the scan step failed
      # afterwards - otherwise the next pass would post them again.
      - name: Persist runtime state
        if: always()
        run: bash .github/scripts/persist_runtime_state.sh fib_trendline_state.json fib_trendline_alert_records.jsonl fib_trendline_results.json

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
