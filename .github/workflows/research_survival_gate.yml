name: Research backtest (survival gate)

# Research only: replays zone alerts with the gate on and off, posts nothing,
# reads and writes no live state. Runs here because the candle APIs are
# reachable from GitHub runners.
on:
  push:
    branches: [claude/project-thread-glogmw]
    paths: [research/survival_gate_backtest.py, .github/workflows/research_survival_gate.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    concurrency: research-gate-${{ github.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt tabulate
      - name: Replay gate on vs off
        run: python research/survival_gate_backtest.py --out research/out_survival_gate 2>&1 | tee research/survival_gate.log
      - name: Commit results to this branch
        run: |
          mkdir -p research/out_survival_gate && mv research/survival_gate.log research/out_survival_gate/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add research/out_survival_gate
          git commit -m "Survival gate backtest results [skip ci]" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
