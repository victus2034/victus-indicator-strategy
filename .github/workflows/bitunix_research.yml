name: Bitunix research (candles + backtest)

# Research only: compares Delta and Bitunix candles and replays the alerts on
# each. Posts nothing, touches no live state. Runs here because the candle
# APIs are not reachable from the cloud sandbox.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "Which parts to run (any of zones-30m zones-4h fib tl-trace tl-nse tl-length tl-crypto tl-anchor tl-quality chart-vs-bot bitunix-window zone-pref-30m zone-pref-4h fzp fpri fsr xstock xstock-zones-30m xstock-zones-4h xstock-fib live-audit uni-trace bitunix-page trend-all tl-confirm tl-break-audit tl-sl fib-sl tl-ex tl-sl-long tl-mkt-trend fib-start bitunix-depth bnb-fib fib-touched fib-entry tl-entry doge-fib fib-kill coindcx magic-fib zone-htf volume qnt-late band-wick risk-warn scores-audit realert trail-fibtl fib-levels fib-levels-apply fib-rearm fib-l3l4 fib-levels-all ec-audit ec-replay early-band tl-break)"
        default: "zones-30m zones-4h fib"

permissions:
  contents: write

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        part: [zones-30m, zones-4h, fib, tl-trace, tl-nse, tl-length, tl-crypto, tl-anchor, tl-quality, chart-vs-bot, bitunix-window, zone-pref-30m, zone-pref-4h, fzp, fpri, fsr, xstock, xstock-zones-30m, xstock-zones-4h, xstock-fib, live-audit, uni-trace, bitunix-page, trend-all, tl-confirm, tl-break-audit, tl-sl, fib-sl, tl-ex, tl-sl-long, tl-mkt-trend, fib-start, bitunix-depth, bnb-fib, fib-touched, fib-entry, tl-entry, doge-fib, fib-kill, coindcx, magic-fib, zone-htf, volume, qnt-late, band-wick, risk-warn, scores-audit, realert, trail-fibtl, fib-rearm, fib-l3l4, fib-levels-all, ec-audit, ec-replay, early-band, tl-break]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        if: contains(format(' {0} ', inputs.parts), format(' {0} ', matrix.part))
      - uses: actions/setup-python@v5
        if: contains(format(' {0} ', inputs.parts), format(' {0} ', matrix.part))
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt tabulate
        if: contains(format(' {0} ', inputs.parts), format(' {0} ', matrix.part))
      - name: Run
        if: contains(format(' {0} ', inputs.parts), format(' {0} ', matrix.part))
        run: |
          mkdir -p research/out/bitunix
          case "${{ matrix.part }}" in
            zones-30m) VICTUS_TIMEFRAME=30m python research/bitunix_compare.py --part zones --tf 30m ;;
            zones-4h)  VICTUS_TIMEFRAME=4h  python research/bitunix_compare.py --part zones --tf 4h ;;
            fib)       python research/bitunix_compare.py --part fib ;;
            tl-trace)  git fetch --depth 1 origin scanner-runtime-state
                       git show FETCH_HEAD:fib_trendline_alert_records.jsonl > /tmp/tl_records.jsonl
                       python research/trendline_trace.py --records /tmp/tl_records.jsonl --since 2026-10-03 ;;
            tl-nse)    mkdir -p research/out/trendline_trace
                       python research/trendline_symbol_trace.py PFIZER.NS --tf 1M --since 2025-01-01 > research/out/trendline_trace/PFIZER_1M.txt 2>&1
                       cat research/out/trendline_trace/PFIZER_1M.txt ;;
            tl-crypto) python research/trendline_crypto_trace.py HYPEUSD --tf 1d
                       python research/trendline_crypto_trace.py HYPEUSD --tf 1d --source delta ;;
            tl-anchor) PYTHONPATH=research python research/trendline_anchor_backtest.py tangent last_lower last_lower_unique ;;
            tl-quality) PYTHONPATH=research python research/trendline_anchor_quality.py ;;
            chart-vs-bot) mkdir -p research/out/chart_vs_bot
                       for s in LTCUSD HYPEUSD BTCUSD; do VICTUS_TIMEFRAME=4h python research/chart_vs_bot.py $s; done > research/out/chart_vs_bot/4h.txt
                       VICTUS_TIMEFRAME=1d python research/chart_vs_bot.py HYPEUSD > research/out/chart_vs_bot/1d.txt
                       cat research/out/chart_vs_bot/*.txt ;;
            bitunix-window) python research/bitunix_window_probe.py --detail ;;
            zone-pref-30m) VICTUS_TIMEFRAME=30m PYTHONPATH=research python research/zone_preference_backtest.py --tf 30m ;;
            zone-pref-4h)  VICTUS_TIMEFRAME=4h  PYTHONPATH=research python research/zone_preference_backtest.py --tf 4h ;;
            fzp) python research/fib_zone_preference.py --since 2026-09-01 ;;
            fpri) python research/fib_priority_backtest.py --since 2026-09-01 ;;
            fsr) python research/fib_sr_logic_backtest.py --since 2026-09-01 ;;
            xstock) mkdir -p research/out/xstock
                       python research/xstock_bitunix_probe.py > research/out/xstock/probe.txt 2>&1; cat research/out/xstock/probe.txt ;;
            xstock-zones-30m) VICTUS_TIMEFRAME=30m python research/bitunix_compare.py --part zones --tf 30m --symbols xstock ;;
            xstock-zones-4h)  VICTUS_TIMEFRAME=4h  python research/bitunix_compare.py --part zones --tf 4h --symbols xstock ;;
            xstock-fib) python research/bitunix_compare.py --part fib --symbols xstock ;;
            live-audit) git fetch --depth 1 origin scanner-runtime-state
                       mkdir -p /tmp/rt research/out/live_audit
                       git archive FETCH_HEAD | tar -x -C /tmp/rt
                       python research/live_audit.py --state /tmp/rt --since 2026-10-05 ;;
            uni-trace) mkdir -p research/out/live_audit
                       python research/uni_zone_trace.py > research/out/live_audit/UNI_TRACE.txt; cat research/out/live_audit/UNI_TRACE.txt ;;
            bitunix-page) mkdir -p research/out/live_audit
                       python research/bitunix_page_probe.py > research/out/live_audit/BITUNIX_PAGE.txt; cat research/out/live_audit/BITUNIX_PAGE.txt ;;
            trend-all) git fetch --depth 1 origin scanner-runtime-state
                       git show FETCH_HEAD:daily_backtest_finalized_records.jsonl > /tmp/finalized.jsonl
                       python research/trend_filter_all_backtest.py --state /tmp/finalized.jsonl --since 2026-09-01 ;;
            tl-sl) python research/trendline_sl_backtest.py --since 2026-09-01 ;;
            fib-sl) python research/fib_sl_backtest.py --since 2026-09-01 ;;
            tl-confirm) python research/trendline_confirm_window.py --symbol DABUR.NS --tf 1d --since 2026-09-01 ;;
            tl-break-audit) git fetch --depth 1 origin scanner-runtime-state
                       git show FETCH_HEAD:fib_trendline_alert_records.jsonl > /tmp/tl_records.jsonl
                       python research/tl_after_break_audit.py --records /tmp/tl_records.jsonl --since 2026-10-01 ;;
            tl-ex) python research/trendline_sl_backtest.py --since 2026-09-01 --examples ;;
            tl-sl-long) python research/trendline_sl_backtest.py --since 2026-06-01 --out long ;;
            tl-mkt-trend) python research/trendline_market_trend.py ;;
            fib-start) python research/fib_history_start_probe.py ;;
            bitunix-depth) python research/bitunix_depth_probe.py ;;
            bnb-fib) PYTHONPATH=research python research/bnb_fib_start_trace.py ;;
            fib-touched) python research/fib_touched_before_backtest.py --since 2026-09-01 ;;
            fib-entry) PYTHONPATH=research python research/fib_entry_touched_backtest.py --since 2026-09-01 ;;
            tl-entry) PYTHONPATH=research python research/tl_entry_touched_backtest.py --since 2026-09-01 ;;
            doge-fib) python research/doge_fib_trace.py ;;
            magic-fib) python research/doge_fib_trace.py MAGICUSDT DOGEUSDT ;;
            fib-kill) PYTHONPATH=research python research/fib_kill_backtest.py --since 2026-09-01 ;;
            coindcx) python research/coindcx_volume_probe.py ;;
            volume) python research/volume_7d_30d_probe.py ;;
            qnt-late) python research/qnt_late_alert_trace.py ;;
            band-wick) PYTHONPATH=research python research/band_wick_backtest.py --since 2026-09-01 ;;
            scores-audit) git fetch --depth 1 origin scanner-runtime-state
                       mkdir -p /tmp/rt
                       git archive FETCH_HEAD | tar -x -C /tmp/rt
                       PYTHONPATH=research python research/daily_scores_audit.py --state /tmp/rt --since 2026-10-05 ;;
            realert) git fetch --depth 1 origin scanner-runtime-state
                       mkdir -p /tmp/rt
                       git archive FETCH_HEAD | tar -x -C /tmp/rt
                       PYTHONPATH=research python research/realert_backtest.py --state /tmp/rt --since 2026-09-01 ;;
            trail-fibtl) PYTHONPATH=research python research/trail_fib_tl_backtest.py --since 2026-09-01 ;;
            tl-break) PYTHONPATH=research python research/tl_break_candle_backtest.py --since 2026-09-01 ;;
            early-band) PYTHONPATH=research python research/early_band_backtest.py --since 2026-09-01 ;;
            fib-levels-all) PYTHONPATH=research python research/fib_levels_all_backtest.py --since 2026-09-01 ;;
            fib-l3l4) PYTHONPATH=research python research/fib_l3_l4_backtest.py --since 2026-09-01 ;;
            fib-rearm) PYTHONPATH=research python research/fib_rearm_backtest.py --since 2026-09-01 ;;
            risk-warn) PYTHONPATH=research python research/risk_warning_backtest.py --since 2026-09-01 ;;
            zone-htf) PYTHONPATH=research python research/zone_htf_backtest.py --since 2026-09-01 ;;
            tl-length) python research/trendline_length_backtest.py --lengths 10,15,20 ;;
            ec-audit) python research/entry_confirm_audit.py ;;
            ec-replay) python research/entry_confirm_replay.py ;;
          esac 2>&1 | tee research/out/bitunix/run_${{ matrix.part }}.log
      - name: Commit results to this branch
        if: always() && contains(format(' {0} ', inputs.parts), format(' {0} ', matrix.part))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A research/out
          git commit -m "Bitunix research results (${{ matrix.part }}) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*5)); done

  # Fib alerts since Oct 1 get their L1-L4 labels and L1/L2/L4 what-ifs (lakky,
  # 2026-10-19; research/fib_level_backfill.py). "fib-levels" is a dry run;
  # "fib-levels-apply" writes the records (backup kept) and fib_level_results.json
  # to scanner-runtime-state, in the fib/trendline scan's group so the two never
  # write the records file at once.
  fib-levels:
    if: contains(format(' {0} ', inputs.parts), ' fib-levels ') || contains(format(' {0} ', inputs.parts), ' fib-levels-apply ')
    concurrency:
      group: victus-fib-trendline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLY: ${{ contains(format(' {0} ', inputs.parts), ' fib-levels-apply ') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore runtime state
        id: restore
        run: bash .github/scripts/restore_runtime_state.sh fib_trendline_alert_records.jsonl fib_trendline_results.json fib_level_results.json
      - name: Label and score
        id: backfill
        run: |
          if [ "$APPLY" = "true" ]; then
            python research/fib_level_backfill.py --state . --apply
          else
            python research/fib_level_backfill.py --state .
          fi
          cat research/out/fib_levels/BACKFILL.md >> "$GITHUB_STEP_SUMMARY"
      - name: Persist runtime state
        if: ${{ always() && steps.restore.outcome == 'success' && steps.backfill.outcome == 'success' && env.APPLY == 'true' }}
        run: |
          bash .github/scripts/persist_runtime_state.sh \
            fib_trendline_alert_records.jsonl \
            fib_trendline_alert_records.pre_levels_2026-10-19.jsonl \
            fib_level_results.json
      - name: Commit the report to this branch
        if: always() && steps.backfill.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add research/out/fib_levels
          git commit -m "Fib level backfill report [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*5)); done
