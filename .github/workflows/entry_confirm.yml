name: Victus Entry Confirm

on:
  # Triggered by cron-job.org, which dispatches this workflow over the
  # API. GitHub's own scheduler is not used: it honours only a fraction
  # of scheduled runs (two of a possible 230 on 30 Aug 2026), and having
  # both fire dispatched every job twice.
  workflow_dispatch:
    inputs:
      market:
        description: "Which alert records to watch"
        required: false
        default: "crypto"
        type: choice
        options:
          - "crypto"
          - "nse"
          - "all"
      timeframe:
        description: "Alert timeframe to watch"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "30m"
          - "4h"
      dry_run:
        description: "Print stage pings without posting to Discord"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ignore_session:
        description: "Skip the 09:15-15:10 IST guard (testing only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: victus-entry-confirm
  cancel-in-progress: false

jobs:
  entry-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cached wheels keep the run short - this job is scheduled every
          # few minutes, so install time is most of the ping's latency.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: |
          bash .github/scripts/restore_runtime_state.sh \
            nse_alert_records_30m.jsonl \
            nse_alert_records.jsonl \
            crypto_alert_records_30m.jsonl \
            crypto_alert_records.jsonl \
            crypto_watch_records_30m.jsonl \
            crypto_watch_records.jsonl \
            entry_confirm_state.json \
            paper_trading_state.json

      - name: Send entry confirmation pings
        env:
          DISCORD_ENTRY_CONFIRM_WEBHOOK_URL: ${{ secrets.DISCORD_ENTRY_CONFIRM_WEBHOOK_URL }}
          # Crypto pings take their price from the same venue chain as
          # the scan, so the level watched is the one on the chart.
          COINSWITCH_API_KEY: ${{ secrets.COINSWITCH_API_KEY }}
          COINSWITCH_SECRET_KEY: ${{ secrets.COINSWITCH_SECRET_KEY }}
          COINSWITCH_EXCHANGE: ${{ secrets.COINSWITCH_EXCHANGE }}
          # Without this the price every entry is judged against is
          # live_ticker_price's fallback: the close of the last COMPLETED
          # candle. Unset, scanner also defaults to 4h, so a 30m zone was
          # being measured against a candle up to four hours old. DOGE on
          # 7 Sep is the shape of it - alerted at 18:52 with price 0.01%
          # off entry, judged at 18:55 against the 17:30 close of 0.090989,
          # read as 0.71% past entry and outside the approach band, and so
          # never pinged at all. Live price then was 0.091690: an entry.
          VICTUS_USE_LIVE_TICKER: "true"
          # The fallback when a venue's ticker is unreachable. One process
          # watches both 30m and 4h records, so no single timeframe is right
          # for both - 30m is chosen because a stale price is what caused
          # this, and a 30m candle is the fresher of the two for either.
          VICTUS_TIMEFRAME: "30m"
          # How far out GET READY fires. Tried 0.75% to match
          # config.WATCH_DISTANCE_PCT (the scanner's silent watch band) so
          # GET READY could fire well before the real alert - reverted 9 Sep,
          # one day later: it meant GET READY pinging on zones 0.53-0.99% away
          # that the real alert in #crypto-30m-alerts never fired for at all,
          # which read as noise rather than an early warning. Back at 0.20% to
          # match MAX_DISTANCE_PCT, so a GET READY only ever precedes a zone
          # that is genuinely about to alert. The scanner still writes a watch
          # row at 0.75% - that stays, it only feeds entry_confirm the zone
          # earlier so its own stage tracking has a head start; it does not by
          # itself cause a ping until price is actually this close.
          VICTUS_APPROACH_THRESHOLD_PCT: "0.20"
          INPUT_TIMEFRAME: ${{ github.event.inputs.timeframe }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_IGNORE_SESSION: ${{ github.event.inputs.ignore_session }}
        run: |
          EXTRA_ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          if [ "$INPUT_IGNORE_SESSION" = "true" ]; then
            EXTRA_ARGS+=(--ignore-session)
          fi
          python entry_confirm.py \
            --timeframe "${INPUT_TIMEFRAME:-both}" \
            --market "${INPUT_MARKET:-crypto}" \
            "${EXTRA_ARGS[@]}"

      # Runs in the same job as the pings: identical cadence, same symbols,
      # and one shared runner boot instead of two. Placed after the pings so
      # a paper-side problem can never delay a real alert.
      - name: Advance paper trading
        env:
          INPUT_TIMEFRAME: ${{ github.event.inputs.timeframe }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_IGNORE_SESSION: ${{ github.event.inputs.ignore_session }}
        run: |
          EXTRA_ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          if [ "$INPUT_IGNORE_SESSION" = "true" ]; then
            EXTRA_ARGS+=(--ignore-session)
          fi
          # NSE paper is paused. "crypto" covers xStocks too - they share
          # the alert records - and both timeframes run, so the comparison
          # table is not silently half empty.
          python paper_trading.py --tick \
            --timeframe both \
            --market crypto \
            "${EXTRA_ARGS[@]}"

      - name: Persist runtime state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          bash .github/scripts/persist_runtime_state.sh \
            entry_confirm_state.json \
            paper_trading_state.json

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
