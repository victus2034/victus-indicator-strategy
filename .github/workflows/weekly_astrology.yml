name: Victus Weekly Astrology

on:
  # Dispatched by the catch-up workflow, which rides the crypto scanner's
  # reliable twenty-minute cadence. GitHub's own cron is gone from here: over
  # nine days it ran the daily briefing 4h42m late at best and 11h35m at
  # worst, never once at its stated time. Leaving it in place would have
  # fired a second, duplicate run hours after the catch-up had already sent
  # one. The due times now live in .github/scripts/dispatch_overdue.sh.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victus-weekly-astrology
  cancel-in-progress: false

jobs:
  weekly-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install astrology dependency
        run: npm ci

      - name: Check private Discord webhook
        env:
          DISCORD_ASTROLOGY_WEBHOOK_URL: ${{ secrets.DISCORD_ASTROLOGY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_ASTROLOGY_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_ASTROLOGY_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Send Victus's weekly astrology briefing
        env:
          DISCORD_ASTROLOGY_WEBHOOK_URL: ${{ secrets.DISCORD_ASTROLOGY_WEBHOOK_URL }}
        run: npm run astrology:weekly

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
