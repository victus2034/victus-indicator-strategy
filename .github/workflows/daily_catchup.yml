name: Victus Daily Catch-up

on:
  # Rides the 30m crypto scanner, which cron-job.org dispatches every five
  # minutes. GitHub's own scheduler is not used here for the same reason the
  # eight alert workflows abandoned it.
  #
  # This deliberately does NOT ride the 4h scanner. That job was switched off
  # to cut load, and it was the original trigger - leaving it here would have
  # stopped astrology and the daily backtest dead the moment it was disabled,
  # with nothing to say why. The 30m scanner is now the only crypto job that
  # runs, so it is the only safe heartbeat to hang these off.
  workflow_run:
    workflows: ["Victus Crypto Scanner 30m"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write      # to dispatch the workflows it finds overdue
  contents: read

concurrency:
  group: victus-daily-catchup
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch anything that missed its slot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/dispatch_overdue.sh

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}). Daily and weekly jobs may not be dispatched: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
